name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - name: Validate portable synthetic collection
        run: node bin/fixtures.mjs verify examples/orders.collection.json
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: LAB_TOKEN=synthetic-ci-validation-token-00000000 docker compose config --quiet
      - name: Validate verified-image Compose profile
        run: LAB_IMAGE=webhook-replay-lab:synthetic-validation LAB_TOKEN=synthetic-ci-validation-token-00000000 LAB_STORAGE_KEY=$(printf 'ab%.0s' {1..32}) docker compose -f compose.image.yaml config --quiet
      - run: docker build -t webhook-replay-lab:test .
      - name: Check isolated container
        shell: bash
        run: |
          set -euo pipefail
          cid=$(timeout 60 docker run -d --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 128m --pids-limit 64 -e LAB_TOKEN=synthetic-ci-validation-token-00000000 webhook-replay-lab:test)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in 1 2 3 4 5; do
            if docker exec "$cid" node -e 'fetch("http://127.0.0.1:4319/api/events", {headers:{authorization:"Bearer synthetic-ci-validation-token-00000000"}}).then(async r=>{if(r.status!==200)process.exit(1);const b=await r.json();if(b.events.length||b.allowlist.length||process.getuid()===0)process.exit(1)}).catch(()=>process.exit(1))'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check persistent restart and signed ingress
        shell: bash
        run: |
          set -euo pipefail
          volume=$(docker volume create)
          cid=$(docker run -d --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 256m --pids-limit 64 -v "$volume:/data" -e LAB_TOKEN=synthetic-ci-validation-token-00000000 -e LAB_DATA_PATH=/data/inbox.enc -e LAB_STORAGE_KEY=$(printf 'ab%.0s' {1..32}) -e LAB_INGRESS_KEY=$(printf 'cd%.0s' {1..32}) webhook-replay-lab:test)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          sleep 2
          docker exec "$cid" node --input-type=module -e '
            import {createHmac} from "node:crypto";
            const body=JSON.stringify({synthetic:true,secret:"should-be-redacted"}),stamp=String(Math.floor(Date.now()/1000)),id="ci-synthetic";
            const signature=createHmac("sha256",Buffer.from("cd".repeat(32),"hex")).update(stamp+"."+id+"."+body).digest("hex");
            const r=await fetch("http://127.0.0.1:4319/ingress",{method:"POST",headers:{"content-type":"application/json","x-lab-timestamp":stamp,"x-lab-event-id":id,"x-lab-signature":"sha256="+signature},body});
            if(r.status!==201)throw Error("Signed capture failed: "+r.status);
          '
          docker stop --time 15 "$cid"
          docker start "$cid"
          sleep 2
          docker exec "$cid" node --input-type=module -e '
            const r=await fetch("http://127.0.0.1:4319/api/events",{headers:{authorization:"Bearer synthetic-ci-validation-token-00000000"}});
            const b=await r.json();if(r.status!==200||b.events.length!==1||b.events[0].payload.secret!=="[REDACTED]"||!b.persistent)throw Error("Restart verification failed");
          '

      - name: Check private Hostinger Compose profile
        run: npm run test:hostinger

      - name: Check isolated ingress reverse proxy
        run: LAB_TEST_IMAGE=webhook-replay-lab:test npm run test:proxy

      - name: Check offline migration, rotation, alerts and rollback in exact image
        run: LAB_TEST_IMAGE=webhook-replay-lab:test node test/offline-container.mjs

      - name: Scan immutable final image and Node advisories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-evidence
          image_id=$(docker image inspect webhook-replay-lab:test --format '{{.Id}}')
          printf '%s\n' "$image_id" > security-evidence/image-id.txt
          docker image inspect "$image_id" > security-evidence/image-inspect.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --image-src docker --scanners vuln --exit-code 1 --format json "$image_id" > security-evidence/trivy.json
          node_version=$(docker run --rm --network none "$image_id" node -p 'process.versions.node')
          curl --fail --silent --show-error --max-time 30 https://raw.githubusercontent.com/nodejs/security-wg/main/vuln/core/index.json -o security-evidence/node-core-feed.json
          SEMVER_MODULE="$(npm root -g)/npm/node_modules/semver" node scripts/check-node-advisories.cjs "$node_version" security-evidence/node-core-feed.json > security-evidence/node-core-result.json
      - name: Export verified Linux amd64 image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-artifact
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')
          tag="webhook-replay-lab:${version}-${GITHUB_SHA:0:12}-amd64"
          image_id=$(cat security-evidence/image-id.txt)
          docker tag "$image_id" "$tag"
          docker image save "$tag" | gzip -n > image-artifact/webhook-replay-lab-linux-amd64.tar.gz
          (cd image-artifact && sha256sum webhook-replay-lab-linux-amd64.tar.gz > SHA256SUMS)
          gzip -dc image-artifact/webhook-replay-lab-linux-amd64.tar.gz | docker image load
          test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$image_id"
          IMAGE_ID="$image_id" IMAGE_TAG="$tag" node --input-type=module -e 'import fs from "node:fs";import {readBuildInfo} from "./src/build-info.js";fs.writeFileSync("image-artifact/build.json",JSON.stringify({...readBuildInfo(),commit:process.env.GITHUB_SHA,imageId:process.env.IMAGE_ID,tag:process.env.IMAGE_TAG,platform:"linux/amd64",archiveFormat:"docker-save+gzip",publishedRegistry:false},null,2)+"\n")'
      - name: Retain verified candidate image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-image-linux-amd64
          path: image-artifact/
          retention-days: 14
          if-no-files-found: error
      - name: Retain security evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-evidence
          path: security-evidence/
          retention-days: 14
          if-no-files-found: warn

  kubernetes:
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-image-linux-amd64
          path: image-artifact
      - name: Install checksum-pinned official test tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hook-tools"
          curl --fail --silent --show-error --location --max-time 90 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/hook-tools/kind"
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/hook-tools/kind" | sha256sum -c -
          curl --fail --silent --show-error --location --max-time 90 https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/hook-tools/kubectl"
          echo "6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  $RUNNER_TEMP/hook-tools/kubectl" | sha256sum -c -
          chmod 700 "$RUNNER_TEMP/hook-tools/kind" "$RUNNER_TEMP/hook-tools/kubectl"
      - name: Verify archive and test disposable Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/hook-tools:$PATH"
          (cd image-artifact && sha256sum -c SHA256SUMS)
          gzip -dc image-artifact/webhook-replay-lab-linux-amd64.tar.gz | docker image load
          tag=$(node -p 'JSON.parse(require("fs").readFileSync("image-artifact/build.json","utf8")).tag')
          expected=$(node -p 'JSON.parse(require("fs").readFileSync("image-artifact/build.json","utf8")).imageId')
          test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$expected"
          LAB_TEST_IMAGE="$tag" KIND_NODE_IMAGE=kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 node test/kubernetes-kind.mjs

  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Run dedicated 30-minute synthetic loopback workload
        shell: bash
        env:
          LAB_ENDURANCE_SECONDS: 1800
          LAB_ENDURANCE_OUTPUT: endurance.json
        run: node test/endurance.mjs | tee endurance.log
      - name: Retain capacity reference and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-endurance-evidence
          path: |
            endurance.json
            endurance.log
          retention-days: 14
          if-no-files-found: warn

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install locked test-only browser tooling
        run: |
          npm ci --prefix test/browser --ignore-scripts --no-audit --no-fund
          node test/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run synthetic private browser acceptance
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/test/browser/node_modules/playwright/index.mjs
        run: |
          node test/ui-smoke.mjs
          node test/fixture-ui-smoke.mjs
          node test/redaction-ui-smoke.mjs
          node test/onboarding-ui-smoke.mjs
          node test/dashboard-smoke.mjs
      - name: Retain synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-browser-screenshots
          path: docs/*preview.png
          retention-days: 14
